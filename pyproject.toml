[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind"
version = "0.1.0"
description = "AI-powered codebase understanding agent for Python repositories"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "RepoMind Contributors"}
]
keywords = ["code-analysis", "ast", "embeddings", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core runtime dependencies will be added as we implement each stage
dependencies = [
    "pathspec>=0.11.0",
    "fastembed>=0.3.0",
    "chromadb>=0.4.0",
    "networkx>=3.0",
    "google-genai>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "sse-starlette>=1.6.0",
]

[project.scripts]
repomind = "repomind.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repomind*"]
exclude = ["tests*", "docs*", "eval_data*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/repomind"
Repository = "https://github.com/yourusername/repomind"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=repomind",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["repomind"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
